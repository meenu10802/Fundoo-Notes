spring.application.name=Fundoo-Notes
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/fundoo_notes
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.exchange=fundoo.exchange
rabbitmq.user.queue=user.registration.queue
rabbitmq.note.queue=note.creation.queue
rabbitmq.user.routing-key=user.registration
rabbitmq.note.routing-key=note.creation

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Spring Cache with Redis backend
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# Logging
logging.level.root=INFO
logging.level.com.example.Fundoo_Notes=DEBUG
logging.level.org.springframework.core.env=DEBUG

# RabbitMQ listener
spring.rabbitmq.listener.simple.auto-startup=true

# JMS listener not used now
# ActiveMQ (JMS)
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin

spring.jms.pub-sub-domain=false
spring.jms.listener.auto-startup=true
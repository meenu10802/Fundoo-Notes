spring.application.name=Fundoo-Notes
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/fundoo_notes
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.exchange=fundoo.exchange
rabbitmq.user.queue=user.registration.queue
rabbitmq.note.queue=note.creation.queue
rabbitmq.user.routing-key=user.registration
rabbitmq.note.routing-key=note.creation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.root=INFO
logging.level.com.fundoonotes=DEBUG
logging.level.org.springframework.core.env=DEBUG

# Infra defaults for UC12-UC16
spring.cache.type=simple
spring.rabbitmq.listener.simple.auto-startup=false
spring.jms.listener.auto-startup=false